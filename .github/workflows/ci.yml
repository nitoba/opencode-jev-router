name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }} and Bun
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.16.0", "24"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install

      - name: TypeScript 7, lint, format, tests, build and package smoke
        run: bun run check

      - name: OpenCode Git manifest compatibility
        if: matrix.node == '24'
        run: node scripts/opencode-git-manifest-smoke.mjs

      - name: Git dependency install smoke without Bun
        if: matrix.node == '24'
        run: bun run test:git-install

      - name: Produce installable package
        if: matrix.node == '24'
        run: bun pm pack --filename opencode-jev-router.tgz

      - uses: actions/upload-artifact@v4
        if: matrix.node == '24'
        with:
          name: opencode-jev-router-package
          path: opencode-jev-router.tgz
