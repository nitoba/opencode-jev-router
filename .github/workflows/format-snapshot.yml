name: Format Snapshot

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install
      - run: bun run format
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: |
            AGENTS.md
            README.md
            package.json
            src
            tests
