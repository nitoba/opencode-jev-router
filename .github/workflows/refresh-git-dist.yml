name: Refresh Git Distribution

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install
      - run: bun run format
      - run: bun run check
      - name: Commit formatted sources and prebuilt distribution
        run: |
          rm .github/workflows/refresh-git-dist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: refresh alpha.7 Git distribution"
          git push origin HEAD:main
